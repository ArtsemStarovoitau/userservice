version: '3.8'

services:
  userservice:
    build: .
    container_name: userservice_dev
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./src:/app/src
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/userservice_db
      - SPRING_DATASOURCE_USERNAME=devuser
      - SPRING_DATASOURCE_PASSWORD=devsecret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres_db
    command: ./gradlew bootRun --no-daemon -Pdebug

  postgres_db:
    image: postgres:15
    container_name: postgres_db_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=userservice_db
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devsecret
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
