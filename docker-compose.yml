version: '3.8'

services:
  userservice:
    build: .
    container_name: userservice_prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/userservice_db
      - SPRING_DATASOURCE_USERNAME=devuser
      - SPRING_DATASOURCE_PASSWORD=devsecret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres:15
    container_name: postgres_db_prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=userservice_db
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devsecret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
